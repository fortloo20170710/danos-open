name: Release

# Manual runs package without publishing; tags also require full qualification.

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Validate and package (publish only qualified tags)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev openssl python3 socat curl
      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.22'
          cache-dependency-path: tools/gnmic/go.sum
      - name: Build locked independent client
        working-directory: tools/gnmic
        run: |
          mkdir -p ../../build
          GOFLAGS=-mod=readonly go build -o ../../build/gnmic github.com/openconfig/gnmic
      - name: Software acceptance (not hardware qualification)
        run: |
          set -euo pipefail
          mkdir -p build/release-evidence
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          bash danos-test/integration/release_check.sh 2>&1 | tee build/release-evidence/software.log
      - name: Full release qualification (tag only)
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # Missing QEMU/VMware/PCI evidence must block publication.
          bash danos-test/integration/run_v016_release_gate.sh 2>&1 | tee build/release-evidence/qualification.log
      - name: Stage OCI context
        run: bash danos-build/stage_mgrd_oci.sh oci-context
      - name: Build mgrd OCI image
        run: docker build -f danos-build/Dockerfile.mgrd -t danos-mgrd:${{ github.ref_name }} oci-context
      - name: Export image
        run: docker save danos-mgrd:${{ github.ref_name }} | gzip > danos-mgrd-${{ github.ref_name }}.tar.gz
      - name: Record package provenance
        run: |
          python3 danos-build/record_package_manifest.py \
            --artifact danos-mgrd-${{ github.ref_name }}.tar.gz \
            --out build/release-evidence/package.json
          sha256sum danos-mgrd-${{ github.ref_name }}.tar.gz > build/release-evidence/SHA256SUMS
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence-${{ github.sha }}
          path: |
            build/release-evidence/
            danos-mgrd-*.tar.gz
          retention-days: 90
      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: docs/release/RELEASE_NOTES_${{ github.ref_name }}.md
          files: |
            danos-mgrd-${{ github.ref_name }}.tar.gz
            build/release-evidence/package.json
            build/release-evidence/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
