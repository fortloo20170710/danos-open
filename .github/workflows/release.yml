name: Release

# Tag push -> GitHub Release with notes + mgrd OCI image artifact.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build & publish release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake libssl-dev openssl python3
      - name: Full acceptance (ctest + interop)
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)
          ctest --test-dir build --output-on-failure
          bash danos-test/integration/release_check.sh
      - name: Build mgrd OCI image
        run: docker build -f danos-build/Dockerfile.mgrd -t danos-mgrd:${{ github.ref_name }} .
      - name: Export image
        run: docker save danos-mgrd:${{ github.ref_name }} | gzip > danos-mgrd-${{ github.ref_name }}.tar.gz
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: docs/release/RELEASE_NOTES_${{ github.ref_name }}.md
          files: danos-mgrd-${{ github.ref_name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
