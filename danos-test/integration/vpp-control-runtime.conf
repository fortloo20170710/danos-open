# Isolated control-plane qualification only: no PCI/DPDK or host interfaces.
unix {
  nodaemon
  cli-listen /run/danos-vpp/cli.sock
}
api-segment { prefix danos-control }
socksvr { socket-name /run/danos-vpp/api.sock }
statseg {
  socket-name /run/danos-vpp/stats.sock
  size 32M
  page-size default
}
memory {
  main-heap-size 64M
  main-heap-page-size default
}
plugins { plugin dpdk_plugin.so { disable } }
